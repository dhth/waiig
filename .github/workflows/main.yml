name: main

on:
  push:
    branches:
      - 'main'

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - "**/*.go"
              - "go.*"
              - "mise.toml"
              - "mise.lock"
              - ".golangci.yml"
              - "main.go"
              - ".github/workflows/main.yml"

  build:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: go golangci-lint gofumpt
      - name: Build
        run: mise run build
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test
